spring.application.name=auth-app
server.port = 8086


# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/auth_app
spring.datasource.username=root
spring.datasource.password=12345

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true`
spring.jpa.open-in-view=false

# JWT Configuration
security.jwt.secret=EQ64Inq1IJSQLuNnUo816FLsVuznOyB0DWTkjK8I06xsvrFjHvMF4Rs++6BKNNKGz+hmwjEi870iXJ7mJNgbxQ==
security.jwt.issuer=${JWT_ISSUER:my-app}

# Token expiration
security.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:3700}
security.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:86400}

# Cookie names
security.jwt.access-cookie-name=${JWT_ACCESS_COOKIE_NAME:access_token}
security.jwt.refresh-cookie-name=${JWT_REFRESH_COOKIE_NAME:refresh_token}

# Cookie security
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
security.jwt.cookie-http-only=${JWT_COOKIE_HTTP_ONLY:true}
security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:lax}
security.jwt.cookie-domain=${JWT_COOKIE_DOMAIN:}

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# GitHub OAuth2 Configuration
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}