spring.application.name=auth-app
server.port = 8086


# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/auth_app
spring.datasource.username=root
spring.datasource.password=12345

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

security.jwt.secret=${JWT_SECRET:EQ64Inq1IJSQLuNnUo816FLsVuznOyB0DWTkjK8I06xsvrFjHvMF4Rs++6BKNNKGz+hmwjEi870iXJ7mJNgbxQ==}
security.jwt.issuer=${JWT_ISSUER:my-app}
security.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:3700}
security.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:86400}
security.jwt.refresh-cookie-name=${JWT_REFRESH_COOKIE_NAME:refresh_token}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
security.jwt.cookie-http-only=${JWT_COOKIE_HTTP_ONLY:true}
security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:lax}
security.jwt.cookie-domain=${JWT_COOKIE_DOMAIN:}
